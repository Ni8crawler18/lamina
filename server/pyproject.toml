[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamina-backend"
version = "0.2.0"
description = "Laminaa — multi-chain autonomous RWA lifecycle backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    # database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    # chains (EVM)
    "web3>=7.0.0",
    # AI
    "anthropic>=0.40.0",
    # MCP server — pinned below 2.0 (2.0.0 rewrote the low-level Server API:
    # dropped @Server.list_tools()/@Server.call_tool(), which app/mcp/server.py uses)
    "mcp>=1.2.0,<2.0.0",
    # messaging channels
    "telegramify-markdown>=1.1.5",
    # jobs / integrations
    "apscheduler>=3.10.0",
    "aiohttp>=3.9.0",
    "rapidfuzz>=3.6.0",
    # reporting
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    # pinned here (not just left to solana/sui's own ranges) so the combined
    # `.[solana,hedera,sui]` install always lands in the one overlapping window both need
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
# solana's InitializeMint2Params (needed by chains/solana/adapter.py) only exists from
# 0.36.11 on, and every version carrying it requires httpx>=0.28.0. pysui<0.90.0 requires
# httpx<0.28, which conflicts outright - pysui>=0.90.0 moved to httpx>=0.28.1,<0.29, which
# overlaps. Pin solana/solders/pysui/httpx together so Render's one combined
# `pip install .[solana,hedera,sui]` resolves instead of hitting ResolutionImpossible.
solana = [
    "solana==0.36.12",
    "solders==0.27.1",
]
hedera = [
    "hiero-sdk-python>=0.2.0",
]
sui = [
    "pysui==0.90.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
