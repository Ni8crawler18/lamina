# Arc Testnet — Circle's stablecoin-native L1 (EVM-compatible).
# USDC is the NATIVE gas token (no ETH needed). USDC also has a standard ERC-20
# representation (6 dec) at the address below, which our payout logic uses.
# Get testnet USDC from https://faucet.circle.com .
# enabled=false until Laminaa contracts (factory + audit_log) are deployed here.
name          = "Arc Testnet"
slug          = "arc-testnet"
family        = "evm"
chain_id      = 5042002
enabled       = true
native_symbol = "USDC"

rpc_url       = "https://rpc.testnet.arc.network"
rpc_url_env   = "RPC_URL_ARC_TESTNET"
explorer_url  = "https://testnet.arcscan.app"

[contracts]
factory   = "0x45a36ea47577A4415cAc75256F78ccD66bC29E2c"
audit_log = "0xca7f1c8BC559F0E20c3F12085A7Fa426397977f7"
usdc      = "0x3600000000000000000000000000000000000000"  # Arc native USDC, ERC-20 (6 dec)
eurc      = "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"  # Arc EURC (6 dec)
