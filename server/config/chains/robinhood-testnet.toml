# Robinhood Chain Testnet — Arbitrum Orbit L2 (RWA-focused).
# Fully deployed: Laminaa contracts live here. Settlement in Paxos USDG (Circle doesn't issue USDC here).
name          = "Robinhood Chain Testnet"
slug          = "robinhood-testnet"
family        = "evm"
chain_id      = 46630
enabled       = true
native_symbol = "ETH"

# Public RPC. Override with the env var named below for a private/paid endpoint.
rpc_url       = "https://rpc.testnet.chain.robinhood.com"
rpc_url_env   = "RPC_URL_ROBINHOOD_TESTNET"
explorer_url  = "https://explorer.testnet.chain.robinhood.com"

[contracts]
factory   = "0xd556c46758B2C4B62f929256dc3FA53fbd375A3A"  # hardened (v1.1) 2026-06-03
audit_log = "0x153786D589c1d3bddEa68f232269d47Cb110D6Cd"  # access-controlled AuditLog
usdc      = "0x7E955252E15c84f5768B83c41a71F9eba181802F"  # Paxos USDG (Global Dollar), 6 dec; was Mock USDC 0x5B6C7cAF7F99f99154fD8375ec935Fcf03F326f5
