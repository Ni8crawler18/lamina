# Solana devnet — Token-2022 permissioned RWA tokens.
# enabled=false until the SolanaAdapter is verified on devnet with a funded
# operator keypair (see the DEVNET VERIFICATION CHECKLIST in
# app/chains/solana/adapter.py). Flip to true once the full lifecycle passes.
name          = "Solana Devnet"
slug          = "solana-devnet"
family        = "solana"
chain_id      = 103            # Solana cluster id (devnet); identifier only, non-EVM
enabled       = false
native_symbol = "SOL"

rpc_url       = "https://api.devnet.solana.com"
rpc_url_env   = "RPC_URL_SOLANA_DEVNET"   # override with a private RPC (Helius/Triton) for rate limits
explorer_url  = "https://solscan.io"

[contracts]
# Circle's official USDC mint on Solana devnet (6 decimals).
usdc = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
# No factory/audit_log program: the token is a native Token-2022 mint and the
# audit log is on-chain SPL memos (a per-asset anchor pubkey). The production
# audit upgrade is an Anchor program — add its program id here as `audit_log`.
