# Sui Testnet — Move closed-loop permissioned RWA tokens (non-EVM family).
# Compliance is enforced by a sui::token TokenPolicy + allowlist (KYC) rule; each
# asset is a shared `Asset` ledger object. Package + caps re-published 2026-06-21
# (see deployment_contract.txt and contracts-sui/). Operator key in SUI_OPERATOR_KEY.
name          = "Sui Testnet"
slug          = "sui-testnet"
family        = "sui"
chain_id      = 101            # identifier only (Sui has no EVM chainId); non-EVM
enabled       = true
native_symbol = "SUI"

rpc_url       = "https://fullnode.testnet.sui.io:443"
rpc_url_env   = "RPC_URL_SUI_TESTNET"   # override with a private RPC for rate limits
explorer_url  = "https://suiscan.xyz/testnet"

[contracts]
# Published lamina_rwa package and the operator-held capability objects.
# Re-published 2026-06-21 (fresh package id so SuiVision indexes it); init mints
# the caps to the operator. Previous package: 0x536b168e3784…3dbe.
package      = "0xc661a0bd13e523652d3c49fea3ca810e6c182a41a8c584272656fa137314c7be"
policy       = "0xf789d4bb56b908c0d996613ce9cb6ac9d37773c382d3024215ebe3d16fcf59d5"  # shared TokenPolicy<RWA>
policy_cap   = "0x7035b8a553e22e4dfa5d494545cbbdc3cfdaaff82cef17793ee1b8c75c74d7ce"  # TokenPolicyCap<RWA>
treasury_cap = "0x748034279e0377a2578d4c3928e6055472e20386d5e4e09ec392722581915b60"  # TreasuryCap<RWA>
operator_cap = "0xda1088347a96448ee3f322229456c3c1881a14da340fe0c3f79e5fa6e35d94df"  # OperatorCap
# Circle's official USDC on Sui testnet (6 decimals) — coupons/principal settle here.
usdc         = "0xa1ec7fc00a6f40db9693ad1415d0c193ad3906494428cf252621037bd7117e29::usdc::USDC"
